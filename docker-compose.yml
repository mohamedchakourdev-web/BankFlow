# Local PostgreSQL and Kafka only.
# BankFlow runs on the host and reads environment variables.
# Do not publish postgres on a port that a local PostgreSQL server already owns.
# Kafka authentication is not configured. Delivery remains at-least-once.

services:

  postgres:
    image: postgres:16
    container_name: bankflow-postgres

    environment:
      POSTGRES_DB: bankflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass13245

    ports:
      - "5432:5432"

    volumes:
      - bankflow_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankflow"]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:3.9.1
    hostname: broker
    container_name: bankflow-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://broker:9092,CONTROLLER://broker:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 1

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker:9092 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s


volumes:
  bankflow_pg_data: