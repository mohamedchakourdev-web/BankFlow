spring:
  application:
    name: bankflow
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: true
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

bankflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION}
  kafka:
    transfer-topic: ${BANKFLOW_TRANSFER_TOPIC:bankflow.transfer-events}
    audit-group: ${BANKFLOW_AUDIT_GROUP:bankflow-audit-consumer}
    notification-group: ${BANKFLOW_NOTIFICATION_GROUP:bankflow-notification-consumer}
  outbox:
    batch-size: ${BANKFLOW_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${BANKFLOW_OUTBOX_POLL_INTERVAL:2000}
    publisher-enabled: ${BANKFLOW_OUTBOX_PUBLISHER_ENABLED:true}
  cors:
    allowed-origins: ${BANKFLOW_ALLOWED_ORIGINS:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${BANKFLOW_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${BANKFLOW_API_DOCS_ENABLED:true}
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    kafka:
      enabled: false

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
